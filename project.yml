name: CameraMind
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CameraMind:
    type: application
    platform: iOS
    sources:
      - path: CameraMind
        excludes:
          - "Info.plist"
    info:
      path: CameraMind/Info.plist
      # 注意：这里必须写全。XcodeGen 会用 properties 重新生成 plist，
      # 漏掉 NSCameraUsageDescription 会导致一取景就被系统杀掉（闪退）。
      properties:
        CFBundleDisplayName: AI 相机
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: zh_CN
        NSCameraUsageDescription: 需要访问相机以实时取景，并把画面发送给 AI 分析
        NSPhotoLibraryAddUsageDescription: 需要保存拍摄的照片
        NSPhotoLibraryUsageDescription: 需要读取相册中的照片用于对比
        NSMicrophoneUsageDescription: 录制视频时需要收音
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UIRequiredDeviceCapabilities:
          - arm64
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    scheme:
      gatherCoverageData: false
      build:
        targets:
          CameraMind: all
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CameraMind
        PRODUCT_NAME: CameraMind
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
