name: CameraMind
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

targets:
  CameraMind:
    type: application
    platform: iOS
    sources:
      - path: CameraMind
        excludes:
          - "Info.plist"
    info:
      path: CameraMind/Info.plist
    scheme:
      gatherCoverageData: false
      build:
        targets:
          CameraMind: all
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.CameraMind
        PRODUCT_NAME: CameraMind
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
